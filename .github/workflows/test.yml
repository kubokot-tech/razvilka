name: test

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck
        run: shellcheck -S error setup.sh install.sh build.sh src/lib/*.sh src/razvilka.sh src/www/*.sh src/init/* src/cron-* tests/*.sh
      - name: Tests
        run: tests/run.sh
      - name: Build and verify payload
        run: |
          VERSION=ci ./build.sh
          sh -n dist/razvilka-setup.sh
          mkdir /tmp/razvilka-payload
          awk '/^payload\(\) \{/{p=1;next} p && /^__RAZVILKA_PAYLOAD__$/{exit} p{print}' dist/razvilka-setup.sh | base64 -d | tar xzf - -C /tmp/razvilka-payload
          diff -ru src /tmp/razvilka-payload
