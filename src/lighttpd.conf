# razvilka: свой экземпляр lighttpd (не зависит от других веб-морд на роутере)
#   @STUB_PORT@ — страница-заглушка kill switch (без пароля, любой путь -> index.html)
#   @WEB_PORT@  — панель управления (basic auth, CGI на shell, работает от root)
server.modules = ( "mod_auth", "mod_authn_file", "mod_rewrite", "mod_setenv", "mod_cgi" )
server.port = @STUB_PORT@
server.document-root = "/opt/razvilka/stub"
server.pid-file = "/opt/var/run/razvilka-web.pid"
server.errorlog = "/opt/var/log/razvilka-web.log"
server.tag = "razvilka"
index-file.names = ( "index.html" )
mimetype.assign = ( ".html" => "text/html; charset=utf-8", ".svg" => "image/svg+xml", ".css" => "text/css" )
url.rewrite-once = ( "^/.*" => "/index.html" )
setenv.add-response-header = ( "Cache-Control" => "no-store, no-cache, must-revalidate", "Pragma" => "no-cache" )

$SERVER["socket"] == ":@WEB_PORT@" {
    server.document-root = "/opt/razvilka/www"
    index-file.names = ( "index.sh" )
    url.rewrite-once = ( )
    cgi.assign = ( ".sh" => "/opt/bin/sh" )
    static-file.exclude-extensions = ( ".sh" )
    auth.backend = "plain"
    auth.backend.plain.userfile = "/opt/razvilka/web.users"
    auth.require = ( "/" => ( "method" => "basic", "realm" => "razvilka", "require" => "valid-user" ) )
}
